<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dual-cube polyhedral viewer</title>
  <style>
    :root { --bg:#0c1018; --panel:#141a24; --text:#d0dce8; --muted:#7a8fa3; --accent:#7ab8ff; --ok:#6dca8e; --bad:#e07a7a; --warn:#e6c36a; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: "Segoe UI", system-ui, sans-serif; }
    #app { display: grid; grid-template-columns: 340px 1fr; height: 100%; }
    aside { background: var(--panel); padding: 1rem; overflow: auto; border-right: 1px solid #243044; }
    h1 { font-size: 1rem; margin: 0 0 0.4rem; }
    .stat { color: var(--muted); font-size: 0.8rem; line-height: 1.45; }
    button, select { font: inherit; background: #243044; color: var(--text); border: 1px solid #3a4d66; border-radius: 6px; padding: 0.35rem 0.55rem; }
    button { cursor: pointer; }
    .row { display: flex; gap: 0.5rem; flex-wrap: wrap; margin: 0.5rem 0; }
    label { font-size: 0.82rem; color: var(--muted); display: flex; gap: 0.4rem; align-items: center; }
    canvas { display: block; width: 100%; height: 100%; }
    .ok { color: var(--ok); } .bad { color: var(--bad); } .warn { color: var(--warn); }
    .note { background: #1c2433; border: 1px solid #3a4d66; border-radius: 8px; padding: 0.55rem 0.65rem; margin: 0.55rem 0; }
    table { width: 100%; border-collapse: collapse; font-size: 0.75rem; color: var(--text); }
    th, td { text-align: left; padding: 0.2rem 0.25rem; border-bottom: 1px solid #243044; }
    th { color: var(--muted); font-weight: 600; }
  </style>
</head>
<body>
  <div id="app">
    <aside>
      <h1>Polyhedral dual-cube</h1>
      <p class="stat">Whole cubes + 45° half-cubes. Cube B is derived from Cube A atoms.</p>
      <div class="row">
        <button id="loadDefault" type="button">Load N=8 Phase 1</button>
        <button id="loadNative" type="button">Load native</button>
        <input id="file" type="file" accept="application/json" />
      </div>
      <div class="row">
        <label><input type="radio" name="asm" value="A" /> Cube A</label>
        <label><input type="radio" name="asm" value="B" /> Cube B</label>
        <label><input type="radio" name="asm" value="explode" /> Exploded</label>
        <label><input type="radio" name="asm" value="cuts" checked /> Cuts</label>
      </div>
      <div class="row">
        <label><input id="highlight" type="checkbox" checked /> Highlight wedges</label>
        <label><input id="isolate" type="checkbox" /> Isolate split pieces</label>
        <label><input id="pull" type="checkbox" checked /> Pull wedges apart</label>
      </div>
      <div class="row">
        <button id="frameCuts" type="button">Frame cuts</button>
      </div>
      <div id="summary" class="stat"></div>
    </aside>
    <canvas id="c"></canvas>
  </div>
  <script type="module" src="/demos/dual_cube_polyhedral_viewer.js"></script>
</body>
</html>
