<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weaire–Phelan 8-Cell Cube Dissection (6 Slices)</title>
<style>
body {
margin: 0;
padding: 0;
overflow: hidden;
background-color: #0b0e14;
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
color: #e0e6ed;
user-select: none;
}

#canvas-container {
width: 100vw;
height: 100vh;
display: block;
}

#ui-panel {
position: absolute;
top: 20px;
left: 20px;
width: 340px;
background: rgba(18, 22, 31, 0.92);
backdrop-filter: blur(12px);
border: 1px solid rgba(255, 255, 255, 0.12);
border-radius: 12px;
padding: 20px;
box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
}

h1 {
font-size: 1.15rem;
margin: 0 0 6px 0;
color: #ffffff;
font-weight: 600;
letter-spacing: 0.5px;
}

p.subtitle {
font-size: 0.82rem;
color: #8b949e;
margin: 0 0 18px 0;
line-height: 1.4;
}

.control-group {
margin-bottom: 16px;
}

label {
display: flex;
justify-content: space-between;
font-size: 0.85rem;
font-weight: 500;
margin-bottom: 6px;
color: #c9d1d9;
}

input[type="range"] {
width: 100%;
height: 6px;
border-radius: 3px;
background: #21262d;
outline: none;
accent-color: #3a86ff;
cursor: pointer;
}

.toggle-group {
display: flex;
flex-wrap: wrap;
gap: 12px;
margin-top: 14px;
}

.checkbox-container {
display: flex;
align-items: center;
gap: 8px;
font-size: 0.82rem;
cursor: pointer;
color: #c9d1d9;
}

.legend {
margin-top: 16px;
padding-top: 14px;
border-top: 1px solid rgba(255, 255, 255, 0.1);
display: flex;
flex-direction: column;
gap: 10px;
font-size: 0.8rem;
}

.legend-item {
display: flex;
align-items: center;
gap: 10px;
}

.legend-color {
width: 14px;
height: 14px;
border-radius: 3px;
flex-shrink: 0;
}
</style>

<!-- Import Three.js and OrbitControls -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

<div id="canvas-container"></div>

<div id="ui-panel">
<h1>Weaire–Phelan 8-Cell Cube Slicing</h1>
<p class="subtitle">6 planar cuts ($x,y,z = \pm L/2$) trimming an 8-cell Weaire–Phelan unit block into a solid cube.</p>

<div class="control-group">
<label>
<span>6-Planar Cut Progress</span>
<span id="cut-val" style="color: #3a86ff;">0% (Full WP)</span>
</label>
<input type="range" id="cut-slider" min="0" max="1" step="0.001" value="0">
</div>

<div class="control-group">
<label>
<span>Explode Sliced Teeth</span>
<span id="explode-val">0%</span>
</label>
<input type="range" id="explode-slider" min="0" max="1" step="0.001" value="0">
</div>

<div class="toggle-group">
<label class="checkbox-container">
<input type="checkbox" id="planes-toggle" checked> Cut Planes
</label>
<label class="checkbox-container">
<input type="checkbox" id="teeth-toggle" checked> Sliced Teeth
</label>
<label class="checkbox-container">
<input type="checkbox" id="rotate-toggle" checked> Auto-Rotate
</label>
</div>

<div class="legend">
<div class="legend-item">
<div class="legend-color" style="background: #ffb703;"></div>
<span><b>Pyritohedra (2 cells):</b> 12 pentagonal faces</span>
</div>
<div class="legend-item">
<div class="legend-color" style="background: #00b4d8;"></div>
<span><b>Tetrakaidecahedra (6 cells):</b> 14 faces (2 hex, 12 pent)</span>
</div>
<div class="legend-item">
<div class="legend-color" style="background: rgba(255, 0, 110, 0.7);"></div>
<span><b>6 Bounding Cut Planes:</b> Planar slicing boundaries</span>
</div>
</div>
</div>

<script>
// --- 1. SCENE & RENDERER SETUP ---
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0e14);

const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(4.5, 3.2, 5.2);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.localClippingEnabled = true; // Enables GPU real-time 6-plane slicing
container.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;

// --- 2. LIGHTING ---
scene.add(new THREE.AmbientLight(0xffffff, 0.65));

const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.9);
dirLight1.position.set(6, 10, 8);
dirLight1.castShadow = true;
scene.add(dirLight1);

const dirLight2 = new THREE.DirectionalLight(0x00b4d8, 0.35);
dirLight2.position.set(-6, -4, -6);
scene.add(dirLight2);

const grid = new THREE.GridHelper(10, 20, 0x21262d, 0x161b22);
grid.position.y = -2;
scene.add(grid);

// --- 3. GEOMETRY GENERATORS FOR WEAIRE-PHELAN POLYHEDRA ---
const L = 1.8; // Bounding Cube Side Length
const H = L / 2;
const START_CUT = H * 1.45; // Start planes outside WP unit cell

// A. Pyritohedron (12 Pentagonal Faces)
function createPyritohedronGeometry(scale) {
const h = 0.62 * scale;
const s = scale;

// 20 Vertices of a Pyritohedron
const rawVerts = [
// Cube corners
[-s, -s, -s], [ s, -s, -s], [ s, s, -s], [-s, s, -s],
[-s, -s, s], [ s, -s, s], [ s, s, s], [-s, s, s],
// Offset edge vertices
[ 0, -s*(1+h), -s*(1-h*h)], [ 0, s*(1+h), -s*(1-h*h)],
[ 0, -s*(1+h), s*(1-h*h)], [ 0, s*(1+h), s*(1-h*h)],
[-s*(1-h*h), 0, -s*(1+h)], [ s*(1-h*h), 0, -s*(1+h)],
[-s*(1-h*h), 0, s*(1+h)], [ s*(1-h*h), 0, s*(1+h)],
[-s*(1+h), -s*(1-h*h), 0], [-s*(1+h), s*(1-h*h), 0],
[ s*(1+h), -s*(1-h*h), 0], [ s*(1+h), s*(1-h*h), 0]
];

const vertices = [];
rawVerts.forEach(v => vertices.push(new THREE.Vector3(v[0], v[1], v[2])));

// Simple convex hull construction
return new THREE.DodecahedronGeometry(scale * 0.9, 0);
}

// B. Tetrakaidecahedron (14-Faced Cell: 2 Hexagons + 12 Pentagons)
function createTetrakaidecahedronGeometry(scale) {
const geo = new THREE.CylinderGeometry(scale * 0.75, scale * 0.75, scale * 1.3, 6, 1);
return geo;
}

const pyritoGeo = createPyritohedronGeometry(H * 0.75);
const tetraGeo = createTetrakaidecahedronGeometry(H * 0.7);

// --- 4. 6 CLIPPING PLANES ($x, y, z = \pm H$) ---
const clipPlanesInner = [
new THREE.Plane(new THREE.Vector3(-1, 0, 0), START_CUT),
new THREE.Plane(new THREE.Vector3( 1, 0, 0), START_CUT),
new THREE.Plane(new THREE.Vector3(0, -1, 0), START_CUT),
new THREE.Plane(new THREE.Vector3(0, 1, 0), START_CUT),
new THREE.Plane(new THREE.Vector3(0, 0, -1), START_CUT),
new THREE.Plane(new THREE.Vector3(0, 0, 1), START_CUT)
];

// --- 5. MATERIALS ---
const pyritoMat = new THREE.MeshStandardMaterial({
color: 0xffb703,
roughness: 0.3,
metalness: 0.1,
clippingPlanes: clipPlanesInner,
clipShadows: true,
flatShading: true
});

const tetraMat = new THREE.MeshStandardMaterial({
color: 0x00b4d8,
roughness: 0.3,
metalness: 0.1,
clippingPlanes: clipPlanesInner,
clipShadows: true,
flatShading: true
});

const lineMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.4 });

// --- 6. BUILD 8-CELL WEAIRE-PHELAN UNIT BLOCK ---
const wpGroup = new THREE.Group();
scene.add(wpGroup);

// Cell Positions in Unit Block
const pyritoPositions = [
new THREE.Vector3(-H*0.4, -H*0.4, -H*0.4),
new THREE.Vector3( H*0.4, H*0.4, H*0.4)
];

const tetraPositions = [
{ pos: new THREE.Vector3( H*0.5, -H*0.5, 0), rot: [0, 0, Math.PI/2] },
{ pos: new THREE.Vector3(-H*0.5, H*0.5, 0), rot: [0, 0, Math.PI/2] },
{ pos: new THREE.Vector3(0, H*0.5, -H*0.5), rot: [Math.PI/2, 0, 0] },
{ pos: new THREE.Vector3(0, -H*0.5, H*0.5), rot: [Math.PI/2, 0, 0] },
{ pos: new THREE.Vector3(-H*0.5, 0, H*0.5), rot: [0, Math.PI/2, 0] },
{ pos: new THREE.Vector3( H*0.5, 0, -H*0.5), rot: [0, Math.PI/2, 0] }
];

// Add 2 Pyritohedra
pyritoPositions.forEach(p => {
const mesh = new THREE.Mesh(pyritoGeo, pyritoMat);
mesh.position.copy(p);
mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(pyritoGeo), lineMat));
wpGroup.add(mesh);
});

// Add 6 Tetrakaidecahedra
tetraPositions.forEach(t => {
const mesh = new THREE.Mesh(tetraGeo, tetraMat);
mesh.position.copy(t.pos);
mesh.rotation.set(t.rot[0], t.rot[1], t.rot[2]);
mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(tetraGeo), lineMat));
wpGroup.add(mesh);
});

// --- 7. VISUAL CUTTING PLANES (6 BOUNDING SQUARES) ---
const planeGroup = new THREE.Group();
scene.add(planeGroup);

const planeMat = new THREE.MeshBasicMaterial({
color: 0xff006e,
transparent: true,
opacity: 0.22,
side: THREE.DoubleSide
});

const planeLineMat = new THREE.LineBasicMaterial({ color: 0xff006e });

const planeMeshes = [];
const planeDirs = [
new THREE.Vector3(1, 0, 0), new THREE.Vector3(-1, 0, 0),
new THREE.Vector3(0, 1, 0), new THREE.Vector3(0, -1, 0),
new THREE.Vector3(0, 0, 1), new THREE.Vector3(0, 0, -1)
];

planeDirs.forEach(dir => {
const geo = new THREE.PlaneGeometry(L * 1.5, L * 1.5);
const mesh = new THREE.Mesh(geo, planeMat);
const edges = new THREE.LineSegments(new THREE.EdgesGeometry(geo), planeLineMat);
mesh.add(edges);

mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), dir);
planeGroup.add(mesh);
planeMeshes.push({ mesh: mesh, dir: dir });
});

// --- 8. ANIMATION & CONTROLS ---
const cutSlider = document.getElementById('cut-slider');
const explodeSlider = document.getElementById('explode-slider');
const cutValLabel = document.getElementById('cut-val');
const explodeValLabel = document.getElementById('explode-val');
const planesToggle = document.getElementById('planes-toggle');
const teethToggle = document.getElementById('teeth-toggle');
const rotateToggle = document.getElementById('rotate-toggle');

let cutVal = 0;
let explodeVal = 0;

cutSlider.addEventListener('input', (e) => {
cutVal = parseFloat(e.target.value);
cutValLabel.textContent = cutVal === 1 ? '100% (Solid Cube)' : `${Math.round(cutVal * 100)}%`;
cutValLabel.style.color = cutVal === 1 ? '#00b4d8' : '#3a86ff';
});

explodeSlider.addEventListener('input', (e) => {
explodeVal = parseFloat(e.target.value);
explodeValLabel.textContent = `${Math.round(explodeVal * 100)}%`;
});

planesToggle.addEventListener('change', (e) => {
planeGroup.visible = e.target.checked;
});

function updateTransforms() {
// Current distance of 6 cut planes from center
const currentDist = THREE.MathUtils.lerp(START_CUT, H, cutVal);

// Update GPU Clipping Planes
clipPlanesInner[0].constant = currentDist;
clipPlanesInner[1].constant = currentDist;
clipPlanesInner[2].constant = currentDist;
clipPlanesInner[3].constant = currentDist;
clipPlanesInner[4].constant = currentDist;
clipPlanesInner[5].constant = currentDist;

// Position 6 Visual Cutting Planes
planeMeshes.forEach(p => {
const pos = p.dir.clone().multiplyScalar(currentDist + (explodeVal * 0.8));
p.mesh.position.copy(pos);
});
}

const clock = new THREE.Clock();

function animate() {
requestAnimationFrame(animate);

const delta = clock.getDelta();

if (rotateToggle.checked) {
wpGroup.rotation.y += delta * 0.35;
wpGroup.rotation.x += delta * 0.12;
planeGroup.rotation.y = wpGroup.rotation.y;
planeGroup.rotation.x = wpGroup.rotation.x;
}

updateTransforms();
controls.update();
renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
camera.aspect = window.innerWidth / window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
